# Pre-commit hooks for Passage.
#
# One-time setup per clone:
#     pip install -r backend/requirements-dev.txt
#     pre-commit install
#
# After that, hooks run automatically on `git commit`. They are scoped to
# specific files (see `files:` regex on each hook), so unrelated commits are
# not slowed down.
#
# To bypass in an emergency: `git commit --no-verify`. Don't make a habit of
# it — the hooks exist because the failure modes they catch were real bugs.

repos:
  - repo: local
    hooks:
      - id: verify-neighborhood-coords
        name: Verify NEIGHBORHOOD_COORDS against Google geocoder
        entry: python backend/scripts/verify_neighborhood_coords.py
        language: system
        files: ^backend/geocoding\.py$
        pass_filenames: false
        # Requires GOOGLE_MAPS_API_KEY in backend/.env. The script makes ~150
        # geocode requests (~10s) and only fires when geocoding.py is staged.
