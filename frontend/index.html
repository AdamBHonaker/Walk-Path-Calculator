<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Real walking directions with exact step counts for Chicago. Walk more, feel better." />
    <meta name="theme-color" content="#171310" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://localhost:8000 http://192.168.1.191:8000 https://*.up.railway.app https://*.openfreemap.org https://tiles.openfreemap.org; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; form-action 'self'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/walkpath-icon-option-a-192.png" />
    <link rel="apple-touch-icon" href="/walkpath-icon-option-a-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Passage</title>
    <script>
      try {
        var t = localStorage.getItem("walkpath:theme");
        if (t === "dusk") document.documentElement.classList.add("theme-dusk");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
