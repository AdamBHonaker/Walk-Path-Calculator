<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Real walking directions with exact step counts for Chicago. Walk more, feel better." />
    <meta name="theme-color" content="#171310" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Content-Security-Policy is injected by the `passage-csp` Vite plugin
         in vite.config.js. The plugin emits dev-vs-prod-specific policies:
         production uses SHA-256 hashes of inline scripts (no 'unsafe-inline'
         for script-src) and strips dev origins; dev keeps the looser policy
         that Vite's HMR runtime + LAN tunnels need. -->
    <link rel="icon" type="image/svg+xml" href="/passage-icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/passage-icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/passage-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/passage-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/passage-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Passage</title>
    <script>
      try {
        var t = localStorage.getItem("walkpath:theme");
        if (t === "dusk") document.documentElement.classList.add("theme-dusk");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
