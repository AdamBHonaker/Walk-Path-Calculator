<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Real walking directions with exact step counts for Chicago. Walk more, feel better." />
    <meta name="theme-color" content="#171310" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Content-Security-Policy is injected by the `passage-csp` Vite plugin
         in vite.config.js. The plugin emits dev-vs-prod-specific policies:
         production uses SHA-256 hashes of inline scripts (no 'unsafe-inline'
         for script-src) and strips dev origins; dev keeps the looser policy
         that Vite's HMR runtime + LAN tunnels need. -->
    <link rel="icon" type="image/svg+xml" href="/passage-icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/passage-icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/passage-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/passage-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/passage-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload the four self-hosted variable fonts so the browser can fetch
         them alongside the HTML rather than waiting for CSS to parse and the
         @font-face rules in wayfarer/fonts.css to resolve. `crossorigin` is
         required for font preloads even on same-origin requests per the
         spec; without it the browser fetches the font a second time when the
         @font-face rule eventually runs. All four are on the critical first
         paint: Fraunces (regular + italic) for the editorial masthead +
         widespread italic UI strings; Inter for forms / labels; JetBrains
         Mono for the step / minute / mile readouts. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/Fraunces-VariableFont_SOFT,WONK,opsz,wght.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/Fraunces-Italic-VariableFont_SOFT,WONK,opsz,wght.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/Inter-VariableFont_opsz,wght.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/JetBrainsMono-VariableFont_wght.woff2" />
    <title>Passage</title>
    <script>
      try {
        var t = localStorage.getItem("walkpath:theme");
        if (t === "dusk") document.documentElement.classList.add("theme-dusk");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
